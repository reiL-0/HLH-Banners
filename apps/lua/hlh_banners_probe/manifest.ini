[ABOUT]
NAME = HLH Banners probe
AUTHOR = HLH
VERSION = 0.2
DESCRIPTION = Probe: talks to the HLH Banners Python app on 127.0.0.1, and a frameless window to compare how a CSP Lua window looks.

[CORE]
LAZY = NONE

[WINDOW_...]
ID = main
NAME = HLH Banners probe
FUNCTION_MAIN = windowMain
SIZE = 560, 90

; A window with none of the game's frame: the flags are the official ones (https://github.com/ac-custom-shaders-patch/acc-lua-sdk/wiki/Lua-apps):
; NO_BACKGROUND makes the background transparent, NO_TITLE_BAR hides the title bar, AUTO_RESIZE fits the window to its content.
[WINDOW_...]
ID = banner
NAME = HLH Banner (frameless test)
FUNCTION_MAIN = windowBanner
SIZE = 400, 70
FLAGS = NO_BACKGROUND, NO_TITLE_BAR, AUTO_RESIZE, NO_COLLAPSE, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE
PADDING = 0, 0
