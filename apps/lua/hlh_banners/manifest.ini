[ABOUT]
NAME = HLH Banners
AUTHOR = HLH
VERSION = 0.1
DESCRIPTION = Race-control banners (flags, notices) as animated capsules in a window you move. DRAFT.

[CORE]
LAZY = NONE

; The banners: a window with none of the game's frame. Official flags (https://github.com/ac-custom-shaders-patch/acc-lua-sdk/wiki/Lua-apps):
; NO_BACKGROUND makes the background transparent, NO_TITLE_BAR hides the title bar, AUTO_RESIZE fits the window to its content.
[WINDOW_...]
ID = banners
NAME = HLH Banners
FUNCTION_MAIN = windowBanners
SIZE = 400, 70
FLAGS = NO_BACKGROUND, NO_TITLE_BAR, AUTO_RESIZE, NO_COLLAPSE, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE
PADDING = 0, 0

[WINDOW_...]
ID = alerts
NAME = HLH Banners - alerts
FUNCTION_MAIN = windowAlerts
SIZE = 400, 70
FLAGS = NO_BACKGROUND, NO_TITLE_BAR, AUTO_RESIZE, NO_COLLAPSE, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE
PADDING = 0, 0

[WINDOW_...]
ID = info
NAME = HLH Banners - info
FUNCTION_MAIN = windowInfo
SIZE = 400, 70
FLAGS = NO_BACKGROUND, NO_TITLE_BAR, AUTO_RESIZE, NO_COLLAPSE, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE
PADDING = 0, 0

[WINDOW_...]
ID = delta
NAME = HLH Banners - delta
FUNCTION_MAIN = windowDelta
SIZE = 330, 110
FLAGS = NO_BACKGROUND, NO_TITLE_BAR, AUTO_RESIZE, NO_COLLAPSE, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE
PADDING = 0, 0

[WINDOW_...]
ID = settings
NAME = HLH Banners settings
FUNCTION_MAIN = windowSettings
SIZE = 520, 400
